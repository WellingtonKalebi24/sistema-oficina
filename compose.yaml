services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-joia_dev}
      POSTGRES_USER: ${POSTGRES_USER:-joia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-joia_dev_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - joia_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-joia}:${POSTGRES_PASSWORD:-joia_dev_password}@db:5432/${POSTGRES_DB:-joia_dev}?schema=public
      RECEPTION_UPLOAD_ROOT: ${RECEPTION_UPLOAD_ROOT:-uploads/reception}
    ports:
      - "${API_HOST_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - joia_reception_uploads:/app/uploads/reception

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  joia_postgres_data:
  joia_reception_uploads:
